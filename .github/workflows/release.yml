name: Release

# On every push to main, Changesets either opens (or updates) a "chore: release" pull request
# from the pending changesets, or, once that pull request is merged, publishes the new version
# to npm. Publishing uses npm trusted publishing (OIDC, no token), which adds provenance.

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # version commits and tags
      pull-requests: write # the release pull request
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@^11.5.1
      - run: npm ci
      - uses: changesets/action@v1
        with:
          version: npx changeset version
          publish: npx changeset publish
          commit: "chore: release"
          title: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
