name: Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One deployment at a time; a newer push replaces a queued one, never one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the demo
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # configure-pages reads the site's settings
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run demo:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: demo/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
